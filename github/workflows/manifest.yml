# Auto-regenerate the model manifest whenever a model file is added,
# renamed, or removed. The browser loader fetches this single JSON to
# discover what models exist — instead of probing every Model_N.<ext>
# combination (which was triggering GitHub Pages rate limits).
#
# Drop a new file like Model_3.ts into public/models/ and push — the
# next deploy will have the updated manifest, with zero manual editing.
name: Rebuild model manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'public/models/**'
      - '.github/workflows/manifest.yml'

# Don't queue duplicate runs while one is already in flight.
concurrency:
  group: manifest
  cancel-in-progress: true

permissions:
  contents: write   # needed for the auto-commit step

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manifest.json
        env:
          MODELS_DIR: public/models
          OUT_FILE:   public/models/manifest.json
        run: |
          set -euo pipefail

          mkdir -p "$MODELS_DIR"

          # Collect every Model_<n>.<ext> file we recognize, in version-sort
          # order so Model_2 comes before Model_10. Excludes manifest.json
          # itself and any hidden / future-prefixed files.
          mapfile -t files < <(
            {
              for ext in ts tsx js jsx json; do
                for f in "$MODELS_DIR"/Model_*.${ext}; do
                  [[ -f "$f" ]] && basename "$f"
                done
              done
            } | awk '!seen[$0]++' | sort -V
          )

          # Emit the manifest. Minimal schema — just id + file, no title
          # (the loader doesn't need it, and the file name is enough).
          {
            echo '{'
            echo '  "version": 1,'
            if [[ ${#files[@]} -eq 0 ]]; then
              echo '  "models": []'
            else
              echo '  "models": ['
              for i in "${!files[@]}"; do
                name="${files[$i]}"
                id="${name%.*}"
                sep=","
                [[ $i -eq $((${#files[@]} - 1)) ]] && sep=""
                printf '    { "id": "%s", "file": "%s" }%s\n' "$id" "$name" "$sep"
              done
              echo '  ]'
            fi
            echo '}'
          } > "$OUT_FILE"

          echo "Wrote $(wc -l < "$OUT_FILE") lines, ${#files[@]} model(s) to $OUT_FILE"
          if [[ ${#files[@]} -gt 0 ]]; then
            printf '  - %s\n' "${files[@]}"
          fi

      - name: Commit if changed
        run: |
          git config user.name  "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add public/models/manifest.json

          if git diff --cached --quiet; then
            echo "No manifest changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore(manifest): refresh model list [skip ci]"
          git push
